name: CD — Deploy to Production

on:
  push:
    branches: [main]

# Railway déploie automatiquement depuis GitHub à chaque push sur main.
# Ce workflow vérifie que le CI est vert avant que Railway lance le build.

jobs:
  ci-gate:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  confirm-deploy:
    name: Confirm Railway deployment triggered
    runs-on: ubuntu-latest
    needs: ci-gate
    steps:
      - name: Deployment triggered
        run: |
          echo "✅ CI passed — Railway is building and deploying the new version."
          echo "Backend : https://railway.app/project (fleet-mgt-api)"
          echo "Frontend: https://railway.app/project (fleet-mgt-frontend)"
