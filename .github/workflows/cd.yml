name: CD — Deploy to Production

on:
  push:
    branches: [main]

# Railway déploie automatiquement depuis GitHub à chaque push sur main.
# Ce workflow vérifie que le CI est vert avant que Railway lance le build.

jobs:
  ci-gate:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  confirm-deploy:
    name: Confirm Railway deployment triggered
    runs-on: ubuntu-latest
    needs: ci-gate
    steps:
      - name: Deployment triggered
        run: |
          echo "✅ CI passed — Railway is building and deploying the new version."
          echo "Backend : https://railway.app/project (fleet-mgt-api)"

  deploy-frontend:
    name: Deploy Frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: ci-gate

    defaults:
      run:
        working-directory: fleet-mgt-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: fleet-mgt-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler pages deploy dist --project-name fleet-citg --branch main
