name: CD — Deploy to Production

on:
  push:
    branches: [main]

# ──────────────────────────────────────────────────────────────────
# Architecture gratuite sans CB :
#   Frontend → Cloudflare Pages  (CDN global, gratuit)
#   API      → Alwaysdata.com    (PHP 8.2, SSH, 100 MB, gratuit)
#   Database → TiDB Cloud        (MySQL-compatible, gratuit)
# ──────────────────────────────────────────────────────────────────

jobs:
  # ── Gate : le CD ne part que si le CI est vert ───────────────────
  ci-gate:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  # ── Deploy Frontend → Cloudflare Pages ───────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Cloudflare Pages
    runs-on: ubuntu-latest
    needs: ci-gate

    defaults:
      run:
        working-directory: fleet-mgt-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fleet-mgt-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy fleet-mgt-frontend/dist --project-name=fleet-frontend --branch=main

  # ── Deploy API → Serv00 (SSH) ─────────────────────────────────────
  deploy-api:
    name: Deploy API → Serv00
    runs-on: ubuntu-latest
    needs: ci-gate

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd ~/fleet-linux/fleet-mgt-api

            git pull origin main

            composer install --no-dev --optimize-autoloader --no-interaction

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            php artisan migrate --force --no-interaction

            echo "Deployed at $(date)"
