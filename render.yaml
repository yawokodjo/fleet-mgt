databases:
  - name: fleet-db
    plan: free
    databaseName: fleet_db
    user: fleet_user

services:
  # ─── Laravel API ──────────────────────────────────────────────────
  - type: web
    name: fleet-api
    runtime: docker
    dockerfilePath: ./fleet-mgt-api/Dockerfile
    dockerContext: ./fleet-mgt-api
    dockerBuildTarget: prod
    plan: free
    healthCheckPath: /api/message
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false        # à renseigner après déploiement : https://<fleet-api>.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: fleet-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: fleet-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: fleet-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: fleet-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: fleet-db
          property: password
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync

  # ─── React Frontend ───────────────────────────────────────────────
  - type: static
    name: fleet-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: ./fleet-mgt-frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false        # à renseigner : https://<fleet-api>.onrender.com
