server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    # CORS headers at server level — inherited by location / (which has no add_header of its own)
    # This ensures the OPTIONS 204 response always carries the CORS headers.
    add_header Access-Control-Allow-Origin      $http_origin always;
    add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, X-Requested-With, X-XSRF-TOKEN" always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Max-Age           86400 always;

    location / {
        if ($request_method = OPTIONS) {
            return 204;
        }
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Repeat CORS headers here — a child location with its own add_header
        # does NOT inherit from the parent, so we must redeclare them.
        add_header Access-Control-Allow-Origin      $http_origin always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, X-Requested-With, X-XSRF-TOKEN" always;
        add_header Access-Control-Allow-Credentials true always;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}
